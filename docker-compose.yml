services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: celpip
      POSTGRES_PASSWORD: celpip
      POSTGRES_DB: celpip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celpip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  proxy:
    image: ghcr.io/1rgs/claude-code-proxy:latest
    ports:
      - "8082:8082"
    env_file:
      - .env

volumes:
  postgres_data:
