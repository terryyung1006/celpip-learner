[project]
name = "celpip-backend"
version = "0.1.0"
description = "CELPIP writing practice AI agent"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.68",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "anyio>=4.0",
]

[project.scripts]
celpip-agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
